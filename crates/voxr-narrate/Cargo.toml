[package]
name = "voxr-narrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Script-to-speech narration: script parsing, speech checks, and take repair"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/voxr"
documentation = "https://docs.rs/voxr-narrate"
readme = "README.md"
keywords = ["narration", "tts", "speech", "voiceover", "audio"]
categories = ["multimedia::audio"]
# Integration tests read JSON oracle fixtures and the JavaScript tools that
# write them. Neither ships.
exclude = ["tests/"]

[lib]
name = "voxr_narrate"
bench = false

[dependencies]
# The sentence pattern uses lookahead; spaCy-style word splitting uses
# lookbehind and lookahead too.
regexr = { version = "0.6", default-features = false }
# Number words are read after NFKD, and the speech check normalizes
# recognized words the same way.
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
# Transcript files are written as JSON.stringify writes them, and read back
# with every number exact.
# `preserve_order`: a manifest's keys keep their order, as JavaScript
# lists them in the messages that name them.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
# RBJ cookbook biquads: the band levels and the bass shelf of a reference
# voice's preparation.
biquad = "0.6"
# A take's own-text seed and a cache key's sha1 digest.
sha1 = "0.11"

# The RIFF/WAVE writer behind the skill's WAV files. Behind features,
# `HeardWord: From<&WordTiming>`, `WhisperTranscriber` and `read_take_16k`:
# Whisper word timings and the audio decode that feeds them. Also
# `stretch_track`: voxr's atempo and resampler. Also the engines the
# adapters drive: Kokoro, VITS and VoxCPM2.
voxr = { path = "../voxr", version = "0.1", default-features = false }
# `WhisperTranscriber` and the VoxCPM2 adapter: the runtime and client a
# checkpoint runs on.
numr = { version = "0.9", optional = true }
# The VoxCPM2 adapter names the model type in the bounds of voxr's engine.
boostr = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Whisper word timings, and the `Hearing` the adapters check takes with.
# With it, `NarrationRuns`: the `SpeakRuns` over loaded engines.
whisper = ["voxr/whisper", "dep:numr"]
# `stretch_track` and `resample_48k`: voxr's ffmpeg-exact atempo and
# resampler, with no voxr feature beyond its default-off set.
stretch = []
# `KokoroSpeech`: voxr's Kokoro engine as a speech engine.
kokoro = ["voxr/kokoro"]
# `VitsSpeech`: voxr's VITS (MMS-TTS) engine as a speech engine.
vits = ["voxr/vits"]
# `VoxcpmSpeech`: voxr's VoxCPM2 engine as a speech engine.
voxcpm = ["voxr/voxcpm", "dep:numr", "dep:boostr"]
# The CUDA runtime for Whisper and VoxCPM2.
cuda = ["voxr/cuda", "dep:numr", "numr/cuda"]

[package.metadata.docs.rs]
# docs.rs has no CUDA toolkit, so `cuda` stays off.
features = ["whisper", "stretch", "kokoro", "vits", "voxcpm"]

[[test]]
name = "narration_oracle"

[[test]]
name = "narration_pace_oracle"

[[test]]
name = "narration_polish_oracle"

[[test]]
name = "narration_transcript_oracle"

[[test]]
name = "narration_take_oracle"

[[test]]
name = "narration_pick_oracle"

[[test]]
name = "narration_anchor_oracle"

[[test]]
name = "narration_join_oracle"

[[test]]
name = "narration_speak_oracle"

[[test]]
name = "narration_review_oracle"

[[test]]
name = "narration_simple_oracle"

[[test]]
name = "narration_place_oracle"

[[test]]
name = "narration_dispatch_oracle"

[[test]]
name = "narration_command_speak_oracle"

[[test]]
name = "narration_command_transcribe_oracle"

[[test]]
name = "adapters_kokoro"
required-features = ["whisper", "kokoro"]

[[test]]
name = "adapters_vits"
required-features = ["whisper", "vits"]

[[test]]
name = "adapters_voxcpm"
required-features = ["whisper", "voxcpm"]

[[test]]
name = "voxcpm_runner_oracle"
required-features = ["voxcpm"]

[[test]]
name = "adapters_hearing"
required-features = ["whisper"]

[[example]]
name = "transcribe_take"
required-features = ["whisper"]
