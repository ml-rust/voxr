[package]
name = "voxr-narrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Script-to-speech narration: script parsing, speech checks, and take repair"
license = "Apache-2.0"

[lib]
name = "voxr_narrate"
bench = false

[dependencies]
# The sentence pattern uses lookahead; spaCy-style word splitting uses
# lookbehind and lookahead too.
regexr = { version = "0.6", default-features = false }
# Number words are read after NFKD, and the speech check normalizes
# recognized words the same way.
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# `HeardWord: From<&WordTiming>`: a script word placed on a Whisper timing.
# A workspace-internal path dependency, off by default so a consumer that
# only parses scripts and checks speech does not pull in voxr's audio stack.
voxr = { path = "../voxr", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = []
whisper = ["dep:voxr", "voxr/whisper"]

[[test]]
name = "narration_oracle"

[[test]]
name = "narration_polish_oracle"
